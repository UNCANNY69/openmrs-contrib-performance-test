name: Run Performance Tests (DB-first, no passwords)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Isolate per-run compose project
      COMPOSE_PROJECT_NAME: openmrs_${{ github.run_id }}

      SIMULATION_PRESET: dev
      TIER_DURATION_MINUTES: 30
      USER_INCREMENT_PER_TIER: 2
      TIER_COUNT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure previous compose stacks and volumes are removed (CI-safe)
        run: |
          set -euo pipefail
          COMPOSE_FILE=src/test/resources/docker-compose.yml
          PROJECT="${COMPOSE_PROJECT_NAME}"
          echo "Bringing down any existing compose project: $PROJECT"
          docker compose -f "$COMPOSE_FILE" -p "$PROJECT" down --remove-orphans --volumes || true

          # Explicitly remove the named DB volume if it exists (safe on hosted runners)
          VOLUME_NAME="${PROJECT}_db-data"
          echo "Attempting to remove volume: $VOLUME_NAME"
          docker volume rm -f "$VOLUME_NAME" || true
        shell: bash

      - name: Start only DB service
        run: |
          set -euo pipefail
          COMPOSE_FILE=src/test/resources/docker-compose.yml
          PROJECT="${COMPOSE_PROJECT_NAME}"
          echo "Starting DB service only for project $PROJECT..."
          docker compose -f "$COMPOSE_FILE" -p "$PROJECT" up -d db
        shell: bash

      - name: Wait for DB to be ready (no password used)
        run: |
          set -euo pipefail
          COMPOSE_FILE=src/test/resources/docker-compose.yml
          PROJECT="${COMPOSE_PROJECT_NAME}"
          DB_CONTAINER=$(docker compose -f "$COMPOSE_FILE" -p "$PROJECT" ps -q db)
          if [ -z "$DB_CONTAINER" ]; then
            echo "ERROR: DB container not found" >&2
            docker ps --format 'table {{.ID}}\t{{.Image}}\t{{.Names}}'
            exit 1
          fi
          echo "DB container id: $DB_CONTAINER"

          # Try quick mysqladmin ping (without password). If that fails, fall back to scanning logs for a 'ready' message.
          echo "Trying mysqladmin ping (no password)..."
          if docker exec "$DB_CONTAINER" mysqladmin ping --silent >/dev/null 2>&1; then
            echo "mysqladmin reports DB alive."
            exit 0
          fi

          echo "mysqladmin ping failed without password — falling back to log scanning."
          TRIES=0
          until docker logs "$DB_CONTAINER" --tail 200 2>&1 | grep -qiE "ready for connections|Server socket created|ready for connections|listening on|ready to accept connections"; do
            TRIES=$((TRIES+1))
            echo "Waiting for DB ready indicator in logs (attempt $TRIES)..."
            if [ $TRIES -ge 120 ]; then
              echo "DB did not report ready in time; dumping last 200 log lines:" >&2
              docker logs "$DB_CONTAINER" --tail 200 || true
              exit 1
            fi
            sleep 1
          done
          echo "DB logs show a ready indicator."
        shell: bash

      - name: Start remaining services (backend, frontend, gateway)
        run: |
          set -euo pipefail
          COMPOSE_FILE=src/test/resources/docker-compose.yml
          PROJECT="${COMPOSE_PROJECT_NAME}"
          echo "Starting backend, frontend, gateway..."
          docker compose -f "$COMPOSE_FILE" -p "$PROJECT" up -d backend frontend gateway
        shell: bash

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: ./mvnw install -DskipTests

      - name: Wait for OpenMRS to be reachable
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/openmrs/login.htm || echo "000")
            echo "HTTP status: $code (attempt $i)"
            if [ "$code" = "200" ]; then
              echo "OpenMRS is up."
              exit 0
            fi
            sleep 10
          done
          echo "OpenMRS did not start in time." >&2
          docker compose -f src/test/resources/docker-compose.yml -p "${COMPOSE_PROJECT_NAME}" ps || true
          exit 1
        shell: bash

      - name: Get System Information
        run: |
          total_ram=$(free -h | grep Mem | awk '{print $2}')
          num_cpus=$(nproc)
          total_disk=$(df -h / | grep / | awk '{print $2}')
          description="Executed on a GitHub Actions runner with ${total_ram} RAM, ${num_cpus} CPUs, and ${total_disk} disk space."
          echo "GATLING_RUN_DESCRIPTION=${description}" >> $GITHUB_ENV
        shell: bash

      - name: Run performance tests
        run: ./mvnw gatling:test -Dgatling.runDescription="${{ env.GATLING_RUN_DESCRIPTION }}"

      - name: Stop and remove containers
        if: always()
        run: docker compose -f src/test/resources/docker-compose.yml -p "${COMPOSE_PROJECT_NAME}" down --remove-orphans --volumes
        shell: bash

      - name: Upload Gatling report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report
          path: target/gatling
          retention-days: 30