name: Run Performance Tests on Single User

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SIMULATION_PRESET: dev
      TIER_DURATION_MINUTES: 30
      USER_INCREMENT_PER_TIER: 2
      TIER_COUNT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start an OpenMRS instance
        run: docker compose -f src/test/resources/docker-compose.yml up -d

      # 🆕 Add this step: Wait for MySQL to be ready
      - name: Wait for MySQL
        run: |
          until docker exec $(docker ps -q --filter ancestor=mariadb:10.11.7) \
            mysqladmin ping -uroot -p${MYSQL_ROOT_PASSWORD:-openmrs} --silent; do sleep 1; done

      # 🆕 Add this step: Reset database to a clean state (and optionally load dump)
      - name: Reset DB
        env:
          MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-openmrs}
        run: |
          DB_CONTAINER=$(docker ps -q --filter ancestor=mariadb:10.11.7)
          # Drop and recreate the openmrs database
          docker exec $DB_CONTAINER mysql -uroot -e \
            "DROP DATABASE IF EXISTS openmrs; CREATE DATABASE openmrs CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"

          # Optional: if you have a dump.sql that initializes tables
          if [ -f src/test/resources/dump/dump.sql ]; then
            docker exec -i $DB_CONTAINER mysql -uroot -p${MYSQL_ROOT_PASSWORD:-openmrs} openmrs < src/test/resources/dump/dump.sql
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Install dependencies
        run: ./mvnw install -DskipTests

      - name: Wait for the OpenMRS instance to start
        run: while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost/openmrs/login.htm)" != "200" ]]; do sleep 10; done

      - name: Get System Information
        run: |
          total_ram=$(free -h | grep Mem | awk '{print $2}')
          num_cpus=$(nproc)
          total_disk=$(df -h / | grep / | awk '{print $2}')
          description="Executed on a GitHub Actions runner with ${total_ram} RAM, ${num_cpus} CPUs, and ${total_disk} disk space."
          echo "GATLING_RUN_DESCRIPTION=${description}" >> $GITHUB_ENV

      - name: Run performance tests
        run: ./mvnw gatling:test -Dgatling.runDescription="${{ env.GATLING_RUN_DESCRIPTION }}"

      - name: Stop the OpenMRS instance
        if: '!cancelled()'
        run: docker stop $(docker ps -a -q)

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: target/gatling
          retention-days: 30